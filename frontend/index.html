<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login & Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- SIGN UP -->
<div class="container" id="signup" style="display:none;">
  <h2>Sign Up</h2>
  <form id="signupForm">
    <input type="text" id="signup-fname" placeholder="First Name" required />
    <input type="text" id="signup-lname" placeholder="Last Name" required />
    <input type="email" id="signup-email" placeholder="Email" required />
    <input type="password" id="signup-password" placeholder="Password" required />
    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <button id="showLogin">Login</button></p>
</div>

<!-- SIGN IN -->
<div class="container" id="login">
  <h2>Login</h2>
  <form id="loginForm">
    <input type="email" id="login-email" placeholder="Email" required />
    <input type="password" id="login-password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>
  <p>Don’t have an account? <button id="showSignup">Sign Up</button></p>
</div>

<script src="script.js"></script>
</body>
</html>
